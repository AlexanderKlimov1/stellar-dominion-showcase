<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Dominion</title>
<!--
  GitHub Pages отдаёт по корню именно index.html, а разбор проекта лежит в demo.html:
  эта страница их и связывает. Ссылка оставлена видимой не для красоты — переход по
  meta refresh отключают и расширения, и читалки, и тогда без неё был бы тупик.
-->
<meta http-equiv="refresh" content="0; url=demo.html">
<link rel="canonical" href="demo.html">
<style>
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070f;
    color: #ccd8ea;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 42ch; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; color: #eef4ff; margin: 0 0 10px; }
  p { color: #a3b4cc; margin: 0 0 18px; }
  a { color: #7fd4ff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Stellar Dominion</h1>
    <p>Разбор проекта открывается на соседней странице.</p>
    <p><a href="demo.html">Открыть разбор проекта →</a></p>
  </div>
</body>
</html>
