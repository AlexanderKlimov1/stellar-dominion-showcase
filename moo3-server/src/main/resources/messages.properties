# Stellar Dominion — server texts, English (the default language and the fallback for
# any other). Russian lives in messages_ru.properties; both files must hold the same keys.
#
# Every value goes through java.text.MessageFormat (always-use-message-format is on):
#   - a literal apostrophe is written doubled: don''t
#   - {0}, {1}… are the substitutions; a literal brace is written '{'
# Keys are grouped by subsystem; exceptions thrown by services name a key here and the
# GlobalExceptionHandler renders it in the language of the Accept-Language header.

